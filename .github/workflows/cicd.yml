name: deploy cobra backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' # Only triggers when the backend code changes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cobra-backend:latest ./backend

      - name: Push Docker image to DockerHub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/cobra-backend:latest

  deploy: 
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull Docker image from DockerHub
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/cobra-backend:latest

      - name: Stop and remove old container
        run: |
          docker stop cobra-backend-container || true
          docker rm -f cobra-backend-container || true

      - name: Create .env file dynamically on AWS
        run: |
          echo "NODE_ENV=production" > .env
          echo "PORT=5000" >> .env
          echo "MONGO_URI=$MONGO_URI" >> .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          echo "JWT_EXPIRES_IN=30d" >> .env
          echo "AWS_REGION=us-east-1" >> .env
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> .env
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> .env
          echo "AWS_S3_BUCKET_NAME=cobra-2-assets" >> .env
          echo "SHIPSTATION_API_KEY=$SHIPSTATION_API_KEY" >> .env
          echo "SMTP_HOST=$SMTP_HOST" >> .env
          echo "SMTP_PORT=$SMTP_PORT" >> .env
          echo "SMTP_USER=$SMTP_USER" >> .env
          echo "SMTP_PASS=$SMTP_PASS" >> .env
          echo "FROM_EMAIL=$FROM_EMAIL" >> .env
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SHIPSTATION_API_KEY: ${{ secrets.SHIPSTATION_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}

      - name: RUN Docker container with env file
        run: |
          docker run -d \
            -p 5000:5000 \
            --name cobra-backend-container \
            --env-file .env \
            ${{ secrets.DOCKER_USERNAME }}/cobra-backend:latest